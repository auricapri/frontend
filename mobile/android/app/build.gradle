apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.auricapri"
    defaultConfig {
        applicationId "com.auricapri"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('AURICAPRI_RELEASE_STORE_FILE')) {
                storeFile file(AURICAPRI_RELEASE_STORE_FILE)
                storePassword AURICAPRI_RELEASE_STORE_PASSWORD
                keyAlias AURICAPRI_RELEASE_KEY_ALIAS
                keyPassword AURICAPRI_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    sourceSets {
        main {
            res.srcDirs = [
                "src/main/res",
                "../../node_modules/react-native/ReactAndroid/src/main/res"
            ]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    
    // Ensure react-native-safe-area-context is included
    implementation project(':react-native-safe-area-context')
    // Ensure react-native-svg is included
    implementation project(':react-native-svg')
    // Ensure react-native-fs is included
    implementation project(':react-native-fs')
    // Ensure @react-native-async-storage/async-storage is included
    implementation project(':react-native-async-storage_async-storage')
}

