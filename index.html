    <!-- Preconnect para Supabase (imagens) — sem crossorigin pois <img> carrega sem crossorigin attribute -->

    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- Inter font — self-hosted variable woff2 (elimina render-blocking Google Fonts) -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>

    <style>
      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* High-end transitions */
      * {
        outline-color: #000;
      }

      /* Shimmer Animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-shimmer {
        background: linear-gradient(90deg, #f3f3f3 25%, #fafafa 50%, #f3f3f3 75%);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }

      /* Splash Animation */
      @keyframes logo-reveal {
        0% { opacity: 0; letter-spacing: 0.2em; transform: scale(0.97); filter: blur(8px); }
        100% { opacity: 1; letter-spacing: 0.6em; transform: scale(1); filter: blur(0); }
      }
      .splash-logo {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 300;
        animation: logo-reveal 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes splash-logo-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.97); }
      }
      .splash-logo-pulse {
        animation: splash-logo-pulse 2s ease-in-out infinite;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
      }
      body.loaded #splash-screen {
        opacity: 0;
        visibility: hidden;
      }
    </style>

        {

          ]
        },
        {
          "@type": "WebSite",
          "name": "Auricapri",
          "url": "https://www.auricapri.com.br",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.auricapri.com.br/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]

    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RC7NRK3PNN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Wait for user consent
      gtag('consent', 'default', {
        'analytics_storage': 'denied'
      });
    </script>

    <!-- Meta Pixel (Facebook) — deferred: loads on first user interaction -->
    <script>
      (function() {
        var loaded = false;
        function loadFBPixel() {
          if (loaded) return;
          loaded = true;
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
        }
        ['scroll','click','touchstart'].forEach(function(evt) {
          document.addEventListener(evt, loadFBPixel, {once: true, passive: true});
        });
      })();
    </script>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <script>
      setTimeout(function() {
        if (window.location.pathname === '/' && !document.body.classList.contains('loaded')) {
          document.body.classList.add('loaded');
        }
      }, 30000);
    </script>
    <!-- Initial Splash Screen -->
    <div id="splash-screen">
      <div class="flex flex-col items-center">
        <span class="splash-logo text-2xl md:text-3xl text-black uppercase tracking-[0.3em]">AURICAPRI</span>
        <div class="mt-8 h-[1px] w-32 bg-neutral-100 relative overflow-hidden">
           <div class="absolute inset-0 bg-black animate-[shimmer_2s_infinite_linear]"></div>
        </div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
