
<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Auricapri — Moda feminina com estilo e elegancia. Vestidos, blusas, saias e acessorios com frete gratis para todo o Brasil.">
    <title>Auricapri</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Auricapri">
    <link rel="manifest" href="/manifest.json">

    <!-- Google Search Console: replace with your verification code -->
    <!-- <meta name="google-site-verification" content="YOUR_CODE_HERE" /> -->

    <!-- Preconnect para fontes Google e Supabase (imagens) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zbrunudbdyuebtpxfnkd.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- Fonte Inter para o splash e aplicação -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* High-end transitions */
      * {
        outline-color: #000;
      }

      /* Shimmer Animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-shimmer {
        background: linear-gradient(90deg, #f3f3f3 25%, #fafafa 50%, #f3f3f3 75%);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }

      /* Splash Animation */
      @keyframes logo-reveal {
        0% { opacity: 0; letter-spacing: 0.2em; transform: scale(0.97); filter: blur(8px); }
        100% { opacity: 1; letter-spacing: 0.6em; transform: scale(1); filter: blur(0); }
      }
      .splash-logo {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 300;
        animation: logo-reveal 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes splash-logo-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.97); }
      }
      .splash-logo-pulse {
        animation: splash-logo-pulse 2s ease-in-out infinite;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
      }
      body.loaded #splash-screen {
        opacity: 0;
        visibility: hidden;
      }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RC7NRK3PNN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Wait for user consent
      gtag('consent', 'default', {
        'analytics_storage': 'denied'
      });
    </script>

    <!-- Meta Pixel (Facebook) — deferred: loads on first user interaction -->
    <script>
      (function() {
        var loaded = false;
        function loadFBPixel() {
          if (loaded) return;
          loaded = true;
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
        }
        ['scroll','click','touchstart'].forEach(function(evt) {
          document.addEventListener(evt, loadFBPixel, {once: true, passive: true});
        });
      })();
    </script>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <script>
      setTimeout(function() {
        if (window.location.pathname === '/' && !document.body.classList.contains('loaded')) {
          document.body.classList.add('loaded');
        }
      }, 30000);
    </script>
    <!-- Initial Splash Screen -->
    <div id="splash-screen">
      <div class="flex flex-col items-center">
        <span class="splash-logo text-2xl md:text-3xl text-black uppercase tracking-[0.3em]">AURICAPRI</span>
        <div class="mt-8 h-[1px] w-32 bg-neutral-100 relative overflow-hidden">
           <div class="absolute inset-0 bg-black animate-[shimmer_2s_infinite_linear]"></div>
        </div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
