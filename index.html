
<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Auricapri</title>
    <link rel="icon" type="image/svg+xml" href="/logo-auricapri-2.svg" />

    <!-- Preconnect para fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonte Inter para o splash e aplicação -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' crossorigin="anonymous" />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js' crossorigin="anonymous"></script>
    <script>
      (function() {
        function initMapbox() {
          if (window.mapboxgl) {
            window.mapboxgl.accessToken = 'pk.eyJ1IjoiYWdlbmRhYnJhc2lsIiwiYSI6ImNtaW5sdnIzcjBhaHIzZW9qcXgyc292a3UifQ.xnR7-Wp3TdMkuuk_g-BcHQ';
            console.log('Mapbox GL JS initialized with token');
            return true;
          }
          return false;
        }
        
        // Try immediately
        if (initMapbox()) return;
        
        // Poll until loaded
        const interval = setInterval(function() {
          if (initMapbox()) {
            clearInterval(interval);
          }
        }, 100);
        
        // Timeout after 10 seconds
        setTimeout(function() {
          clearInterval(interval);
          if (!window.mapboxgl) {
            console.error('Mapbox GL JS failed to load after 10 seconds');
          }
        }, 10000);
      })();
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Thin scrollbar for product detail */
      .scrollbar-thin::-webkit-scrollbar { width: 4px; }
      .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background: #E5E5E5; border-radius: 2px; }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #D4D4D4; }
      .scrollbar-thumb-neutral-200::-webkit-scrollbar-thumb { background: #E5E5E5; }
      .scrollbar-track-transparent::-webkit-scrollbar-track { background: transparent; }
      
      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* High-end transitions */
      * {
        outline-color: #000;
      }

      /* Shimmer Animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-shimmer {
        background: linear-gradient(90deg, #f3f3f3 25%, #fafafa 50%, #f3f3f3 75%);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }

      /* Splash Animation */
      @keyframes logo-reveal {
        0% { opacity: 0; letter-spacing: 0.2em; transform: scale(0.97); filter: blur(8px); }
        100% { opacity: 1; letter-spacing: 0.6em; transform: scale(1); filter: blur(0); }
      }
      .splash-logo {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 300;
        animation: logo-reveal 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes splash-logo-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.97); }
      }
      .splash-logo-pulse {
        animation: splash-logo-pulse 2s ease-in-out infinite;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
      }
      body.loaded #splash-screen {
        opacity: 0;
        visibility: hidden;
      }

      /* Checkmark Animation */
      .checkmark__circle {
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        stroke-width: 2;
        stroke-miterlimit: 10;
        stroke: #22c55e; /* Green-500 */
        fill: none;
        animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
      }
      .checkmark {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: block;
        stroke-width: 2;
        stroke: #22c55e;
        stroke-miterlimit: 10;
        box-shadow: inset 0px 0px 0px #22c55e;
        animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
      }
      .checkmark__check {
        transform-origin: 50% 50%;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
      }
      @keyframes stroke {
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scale {
        0%, 100% { transform: none; }
        50% { transform: scale3d(1.1, 1.1, 1); }
      }
      @keyframes fill {
        100% { box-shadow: inset 0px 0px 0px 50px #dcfce7; } /* Green-100 fill */
      }

      /* Performance optimization for backdrop filters */
      .backdrop-blur-xl {
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
      }

      /* Mapbox Marker Styles */
      .marker-pin {
        width: 30px;
        height: 30px;
        border-radius: 50% 50% 50% 0;
        background: black;
        position: absolute;
        transform: rotate(-45deg);
        left: 50%;
        top: 50%;
        margin: -15px 0 0 -15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }
      .marker-pin::after {
        content: '';
        width: 14px;
        height: 14px;
        margin: 8px 0 0 8px;
        background: white;
        position: absolute;
        border-radius: 50%;
      }
      .marker-pulse {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 50%;
        height: 14px;
        width: 14px;
        position: absolute;
        left: 50%;
        top: 50%;
        margin: 11px 0px 0px -12px;
        transform: rotateX(55deg);
        z-index: -2;
      }
      .marker-pulse:after {
        content: "";
        border-radius: 50%;
        height: 40px;
        width: 40px;
        position: absolute;
        margin: -13px 0 0 -13px;
        animation: pulsate 1s ease-out;
        animation-iteration-count: infinite;
        opacity: 0;
        box-shadow: 0 0 1px 2px rgba(0, 0, 0, 0.5);
        animation-delay: 1.1s;
      }
      @keyframes pulsate {
        0% { transform: scale(0.1, 0.1); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: scale(1.2, 1.2); opacity: 0; }
      }

      /* PRINT STYLES */
      @media print {
        body * {
          visibility: hidden;
        }
        #receipt-container, #receipt-container * {
          visibility: visible;
        }
        #receipt-container {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          background: white !important;
          color: black !important;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Wait for user consent
      gtag('consent', 'default', {
        'analytics_storage': 'denied'
      });
    </script>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <script>
      // Safety fallback: Only remove splash after 30 seconds if something goes very wrong
      // Only apply if we're on home page (pathname is /)
      setTimeout(function() {
        if (window.location.pathname === '/' && !document.body.classList.contains('loaded')) {
          console.error('HTML: Emergency fallback (30s) - forcing splash removal');
          document.body.classList.add('loaded');
        }
      }, 30000);
    </script>
    <!-- Initial Splash Screen -->
    <div id="splash-screen">
      <div class="flex flex-col items-center">
        <span class="splash-logo text-2xl md:text-3xl text-black uppercase tracking-[0.3em]">AURICAPRI</span>
        <div class="mt-8 h-[1px] w-32 bg-neutral-100 relative overflow-hidden">
           <div class="absolute inset-0 bg-black animate-[shimmer_2s_infinite_linear]"></div>
        </div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Debug: Log when DOM is ready
      console.log('HTML: DOM loaded, root element:', document.getElementById('root'));
      
      // Check if script loaded after 2000ms (only on home page)
      setTimeout(function() {
        if (window.location.pathname === '/' && !document.getElementById('root')?.hasChildNodes()) {
          console.error('HTML: Root element is empty after 2000ms - app may not have loaded');
          document.body.classList.add('loaded');
        }
      }, 2000);
    </script>
  </body>
</html>
